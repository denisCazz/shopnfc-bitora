services:
  db:
    image: postgres:18-alpine
    container_name: shopnfc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopnfc}
      POSTGRES_USER: ${POSTGRES_USER:-shopnfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopnfc_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopnfc} -d ${POSTGRES_DB:-shopnfc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    profiles: ["prod"]
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        AUTH_SECRET: ${AUTH_SECRET}
        NEXT_PUBLIC_APP_ENVIRONMENT: ${NEXT_PUBLIC_APP_ENVIRONMENT:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: shopnfc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3100}:3000"
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
